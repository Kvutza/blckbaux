# Rademacher Bayesian optimization with ENN across the complete H-Net parameter space.
# Each BO round scores next-token likelihood over a 4,096-token causal sequence
# sampled from the named data recipe.
# Candidate weights remain resident in unified memory; independent Rademacher proposals
# perturb the complete parameter space.
version = 4

experiment = "pretrain"
model = "fbt-pisa1-hnet-mhc4-v1"
[data]
recipe = "stack-v3-rust-go-v1"

[objective]
function = "cross-entropy"
sampling = "natural"
window-tokens = 4096

[execution]
rounds = 128
round-target-ms = 200

[evaluation]
interval = 128

[optimizer]
algorithm = "turbo-enn"

[optimizer.candidate-generation]
generator = "independent"
arms = 4
candidates = 4

[optimizer.candidate-generation.perturbation]
distribution = "rademacher"

[optimizer.surrogate]
estimator = "enn"
scaling = "global"
neighbors = 32
neighbor-rule = "fixed"
epistemic-scale = 0.05
aleatoric-scale = 0.05

fit = "leave-one-out"
fit-candidates = 4
fit-samples = 4

[optimizer.acquisition]
function = "upper-confidence-bound"
beta = 1.0

[optimizer.trust-region]
policy = "turbo"
shape = "scalar"
initial = 0.001
min = 0.0001
max = 0.1

[seeds]
model = 240105308887621659
reference = 150813718214252701
proposal = 91614869253048103
acquisition = 314159265358979323


[diagnostics]
stage-samples = 3
