# 1,048,576-token pretraining experiment on Apple Silicon Metal with adaptive k-NN.
# Full-parameter Bayesian optimization of fbt-pisa1-hnet-mhc4-v1.
# 200 rounds of next-token likelihood over 1,048,576-token causal sequences.
# Query-local neighborhood selection via the experimental risk-prefix rule.
version = 4

experiment = "pretrain"
model = "fbt-pisa1-hnet-mhc4-v1"
[data]
recipe = "stack-v3-rust-go-v1"

[objective]
function = "cross-entropy"
sampling = "natural"
window-tokens = 1048576

[execution]
rounds = 200
round-target-ms = 200

[evaluation]
interval = 25

[optimizer]
algorithm = "operator-bo"

[optimizer.candidate-generation]
generator = "independent"
arms = 4
candidates = 4

[optimizer.candidate-generation.perturbation]
distribution = "gaussian"

[optimizer.surrogate]
estimator = "knn"
scaling = "global"
neighbors = 32
neighbor-rule = "risk-prefix"
epistemic-scale = 0.05
aleatoric-scale = 0.05

fit = "leave-one-out"
fit-candidates = 4
fit-samples = 4

[optimizer.acquisition]
function = "upper-confidence-bound"

[optimizer.acceptance]
criterion = "positive-improvement"

[optimizer.radius-control]
policy = "reliability"
initial = 0.4
min = 0.001
max = 2.00

[seeds]
model = 240105308887621659
reference = 150813718214252701
proposal = 91614869253048103
acquisition = 314159265358979323


[diagnostics]
stage-samples = 3
