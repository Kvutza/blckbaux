#:schema ../../schemas/tune-spec.schema.json
# FineWeb benchmark with 1-forward-pass active subspace Bayesian optimization on H-Net.
# Targets the cached FineWeb-Edu pretraining corpus with active-subspace energy concentration
# across rotating parameter families on Apple Silicon Metal.
version = 4

experiment = "pretrain"
model = "fbt-pisa1-hnet-mhc4-v1"

[data]
recipe = "fineweb-edu-v1"

[objective]
function = "cross-entropy"
sampling = "natural"
window-tokens = 4096

[execution]
rounds = 10000
round-target-ms = 200

[evaluation]
interval = 25

[optimizer]
algorithm = "turbo-enn"

[optimizer.candidate-generation]
generator = "pair-rotation"
arms = 2
candidates = 4

[optimizer.candidate-generation.perturbation]
distribution = "gaussian"

[optimizer.surrogate]
estimator = "enn"
scaling = "global"
neighbors = 10
neighbor-rule = "fixed"
epistemic-scale = 0.05
aleatoric-scale = 0.05

fit = "leave-one-out"
fit-candidates = 30
fit-samples = 10

[optimizer.acquisition]
function = "thompson"

[optimizer.trust-region]
policy = "reliability"
initial = 0.02
min = 0.01
max = 0.2
failure-tolerance = 4
shape = "active-rotate"

[seeds]
model = 240105308887621659
reference = 150813718214252701
proposal = 91614869253048103
acquisition = 314159265358979323

[diagnostics]
stage-samples = 3
