[project]
name = "blckbaux-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.16"
dependencies = []

[dependency-groups]
pretrain = [
    "datasets==4.1.1",
    "tokenizers==0.21.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
fix = true
unsafe-fixes = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
# Rust/native edits are invisible to testmon; use `pytest --testmon` only for
# incremental local runs.
addopts = ""
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = ["bazel-*"]
markers = [
    "slow: optional long-running stress tests (deselect with '-m \"not slow\"')",
    "gp: tests for the optional Torch and GPyTorch surrogate",
]
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]
