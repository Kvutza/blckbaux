#:schema ../schemas/tune-spec.schema.json
# ENN with additive parameter-pair rotation and Gaussian innovations.
# The proposal is not a learned Lie commutator or an exact orthogonal update.
version = 4

experiment = "pretrain"
model = "fbt-pisa1-hnet-mhc4-v1"
[data]
recipe = "stack-v3-rust-go-v1"

[objective]
function = "cross-entropy"
sampling = "natural"
window-tokens = 4096

[execution]
rounds = 128
round-target-ms = 200

[evaluation]
interval = 128

[optimizer]
algorithm = "operator-bo"

[optimizer.candidate-generation]
generator = "pair-rotation"
arms = 2
candidates = 4

[optimizer.candidate-generation.perturbation]
distribution = "gaussian"

[optimizer.surrogate]
estimator = "knn"
scaling = "global"
neighbors = 32
neighbor-rule = "fixed"
epistemic-scale = 0.05
aleatoric-scale = 0.05

fit = "leave-one-out"
fit-candidates = 4
fit-samples = 4

[optimizer.acquisition]
function = "thompson"

[optimizer.acceptance]
criterion = "positive-improvement"

[optimizer.radius-control]
policy = "reliability"
initial = 0.001
min = 0.0001
max = 0.016

[seeds]
model = 240105308887621659
reference = 150813718214252701
proposal = 91614869253048103
acquisition = 314159265358979323


[diagnostics]
stage-samples = 3
